# The name of the workflow
name: Test

# This workflow will run on any push to the repository
on: push

jobs:
  test:
    # Set up the virtual machine for testing
    runs-on: ubuntu-latest

    services:
      # Configure PostgreSQL service
      postgres:
        image: postgres:13
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: makersbnb_test
        ports:
          - 5432:5432
        # Give PostgreSQL some time to initialize
        options: >-
          --health-cmd="pg_isready -d makersbnb_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # Step to check out the code
      - name: Check out the code
        uses: actions/checkout@v3

      # Set up Python 3.11.0
      - name: Set up Python 3.11.0
        uses: actions/setup-python@v4
        with:
          python-version: 3.11.0

      # Install pip and dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install

      # Run tests with pytest
      - name: Test with pytest
        env:
            PGPASSWORD: postgres
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_HOST: localhost
            POSTGRES_PORT: 5432
        run: |
          PGPASSWORD=$POSTGRES_PASSWORD createdb -h localhost -p 5432 -U postgres makersbnb_test
          pytest

