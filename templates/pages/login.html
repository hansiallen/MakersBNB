{% include '/core/header.html' %}
{% include '/core/nav.html' %}
<main>
    <h1>Log in to MakersBnB</h1>
    <div class="login-box">
        <form action="{{ url_for('get_login_route') }}" method="POST">
            {% if error %}
            <!-- If so, print the error -->
            <p id="error-message" class="error">Login error: {{ error }}</p>
            {% endif %}
            <label for="email">Email Address</label>
            <input type="text" name="email" id="email" placeholder="email@example.com" required aria-describedby="error-message">
        <br>
            <label for="password">Password</label>
            <input type="password" name="password" id="password" placeholder="********" required>
            <br>
            <button type="submit">Log in</button>
        </form>
    </div>
</main>
{% include '/core/footer.html' %}
